name: APK

on:
  push:
    branches:
      - claude/la-muralla-habit-app-odxnfn
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build La Muralla APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the artifact
        id: name
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             "out/la-muralla-${{ github.run_number }}.apk"
          echo "apk=out/la-muralla-${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: la-muralla-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish a release so the APK has a direct download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: La Muralla · build ${{ github.run_number }}
          body: |
            APK de prueba de **La Muralla**.

            Firmada con la clave de debug: se instala directo en el teléfono
            (Android 6.0 / API 23 o superior). Si tenías una build anterior
            instalada, desinstalala antes.
          files: out/*.apk
          prerelease: true
          fail_on_unmatched_files: true
